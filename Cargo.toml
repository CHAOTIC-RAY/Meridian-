[package]
name = "meridian"
version = "2.0.0"
edition = "2021"

[dependencies]
axum = "=0.7.5"
tokio = { version = "=1.38.2", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "=0.5.2", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.31.0", features = ["bundled"] }
