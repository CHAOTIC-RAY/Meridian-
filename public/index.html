<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Meridian Cinemas</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:#0b0b0d;color:#f2f2f0}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#352024 0%,#0b0b0d 58%)}
main{width:min(100%,440px);text-align:center;padding:42px 26px;border:1px solid #292329;border-radius:24px;background:#141417cc;box-shadow:0 24px 90px #0008}
.mark{width:54px;height:54px;margin:0 auto 24px;border:1px solid #6fe0ae;border-radius:17px;display:grid;place-items:center;color:#6fe0ae;font-size:25px}
h1{font-family:Georgia,serif;font-weight:500;font-size:36px;letter-spacing:-1px;margin:0 0 10px}
p{color:#a5a1a5;line-height:1.6;font-size:14px;margin:0}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:28px;padding:8px 13px;border:1px solid #343238;border-radius:99px;color:#c8c4c8;font-size:12px}
.status i{width:7px;height:7px;border-radius:50%;background:#6fe0ae}
small{display:block;margin-top:28px;color:#68656b;font-size:11px}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true">M</div>
<h1>Meridian Cinemas</h1>
<p>The cinema experience is being prepared. The Cloudflare site is online, but booking services are not connected yet.</p>
<div class="status"><i></i> Frontend hosting ready</div>
<small>Meridian Cinemas</small>
</main>
</body>
</html>
