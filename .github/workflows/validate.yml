name: Validate Cloudflare Worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Check Worker JavaScript syntax
        run: npm run typecheck
      - name: Validate D1 migration SQL
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3
          sqlite3 :memory: < migrations/0001_init.sql
